<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EU1 BETA | Frost Supply & Gift Code Depot</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-deep: #060b13;
      --bg-card: rgba(14, 26, 43, 0.78);
      --border-ice: rgba(120, 210, 255, 0.28);
      --accent-frost: #56d4ff;
      --accent-glow: rgba(86, 212, 255, 0.45);
      --text-main: #e8f5ff;
      --text-muted: #8ca3be;
      --gold-tag: #ffd166;
      --success-green: #00ff88;
    }

    body.halloween {
      --bg-deep: #09060f;
      --bg-card: rgba(26, 16, 36, 0.85);
      --border-ice: rgba(255, 123, 0, 0.4);
      --accent-frost: #ff8400;
      --accent-glow: rgba(255, 132, 0, 0.5);
      --text-main: #fff2e0;
      --text-muted: #ad94a8;
      --gold-tag: #ffb703;
      --success-green: #ffb703;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg-deep);
      color: var(--text-main);
      font-family: 'Rajdhani', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
      padding-bottom: 70px;
    }

    #snowCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    .container {
      position: relative;
      z-index: 2;
      width: min(94vw, 860px);
      margin: 0 auto;
      padding: 16px 8px;
    }

    .top-badge-banner {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(4, 9, 16, 0.85);
      border: 1px solid var(--border-ice);
      padding: 10px 16px;
      border-radius: 12px;
      backdrop-filter: blur(8px);
      margin-bottom: 18px;
    }

    .server-tag {
      font-family: 'Cinzel', serif;
      font-size: 1.05rem;
      font-weight: 900;
      letter-spacing: 2px;
      color: var(--accent-frost);
      text-shadow: 0 0 10px var(--accent-glow);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .pulse-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #00ff88;
      box-shadow: 0 0 8px #00ff88;
    }

    .theme-toggle-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border-ice);
      color: var(--text-main);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .hero-header {
      text-align: center;
      padding: 24px 12px;
      margin-bottom: 20px;
      border-radius: 16px;
      background: radial-gradient(circle at center, rgba(86, 212, 255, 0.12) 0%, transparent 70%);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .hero-title {
      font-family: 'Cinzel', serif;
      font-size: 2.2rem;
      font-weight: 900;
      letter-spacing: 3px;
      color: #fff;
      text-transform: uppercase;
      text-shadow: 0 0 16px var(--accent-glow);
    }

    .hero-subtitle {
      color: var(--text-muted);
      font-size: 1.05rem;
      letter-spacing: 1.2px;
      margin-top: 6px;
    }

    .action-deck {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 20px;
    }

    .search-row {
      display: flex;
      gap: 8px;
    }

    .search-input {
      flex: 1;
      padding: 12px 16px;
      border-radius: 10px;
      border: 1px solid var(--border-ice);
      background: rgba(10, 20, 32, 0.7);
      color: #fff;
      font-family: 'Rajdhani', sans-serif;
      font-size: 1.05rem;
      outline: none;
    }

    .search-input:focus {
      border-color: var(--accent-frost);
      box-shadow: 0 0 10px var(--accent-glow);
    }

    .btn-action {
      padding: 12px 18px;
      border-radius: 10px;
      border: 1px solid var(--border-ice);
      background: rgba(18, 38, 62, 0.8);
      color: var(--accent-frost);
      font-family: 'Rajdhani', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
      white-space: nowrap;
    }

    .btn-action:hover, .btn-action:active {
      background: var(--accent-frost);
      color: #040910;
      box-shadow: 0 0 14px var(--accent-glow);
    }

    .code-count-label {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--text-muted);
      letter-spacing: 1px;
      padding-left: 4px;
    }

    .codes-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 14px;
    }

    .code-card {
      background: var(--bg-card);
      border: 1px solid var(--border-ice);
      border-radius: 14px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      overflow: hidden;
      backdrop-filter: blur(8px);
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .code-card:hover {
      transform: translateY(-2px);
      border-color: var(--accent-frost);
    }

    .code-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .card-badge {
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      padding: 3px 8px;
      border-radius: 6px;
      background: rgba(86, 212, 255, 0.15);
      color: var(--accent-frost);
      border: 1px solid var(--border-ice);
    }

    .code-value {
      font-family: 'Cinzel', serif;
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: 1.5px;
      color: #ffffff;
      margin-bottom: 12px;
      word-break: break-all;
      user-select: all;
      -webkit-user-select: all;
    }

    .btn-copy {
      width: 100%;
      padding: 10px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border-ice);
      border-radius: 8px;
      color: var(--accent-frost);
      font-family: 'Rajdhani', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.25s ease;
    }

    .btn-copy:active {
      transform: scale(0.97);
    }

    /* Copied visual indicator state */
    .btn-copy.copied {
      background: var(--success-green) !important;
      color: #040d16 !important;
      border-color: var(--success-green) !important;
      font-weight: 800;
      box-shadow: 0 0 12px rgba(0, 255, 136, 0.5);
    }

    .toast-pill {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: #00ff88;
      color: #040d16;
      font-weight: 800;
      font-size: 0.95rem;
      padding: 10px 22px;
      border-radius: 30px;
      box-shadow: 0 4px 20px rgba(0, 255, 136, 0.4);
      z-index: 99;
      opacity: 0;
      transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      pointer-events: none;
    }

    .toast-pill.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
  </style>
</head>
<body>

  <canvas id="snowCanvas"></canvas>

  <div class="container">
    <header class="top-badge-banner">
      <div class="server-tag">
        <span class="pulse-dot"></span>
        EU1 BETA REALM
      </div>
      <button class="theme-toggle-btn" id="themeBtn" onclick="toggleSpookyTheme()">
        <span id="themeIcon">🎃</span> <span id="themeText">Spooky Tundra</span>
      </button>
    </header>

    <div class="hero-header">
      <h1 class="hero-title">GIFT CODE HUB</h1>
      <p class="hero-subtitle">Official Community Supply Cache • Standalone Beta Tool</p>
    </div>

    <div class="action-deck">
      <div class="search-row">
        <input type="text" id="searchInput" class="search-input" placeholder="Search codes (e.g., FROST, GEAR)..." oninput="renderCards()">
        <button class="btn-action" id="btnCopyAll" onclick="copyAllCodes()">📋 Copy All</button>
      </div>
      <div class="code-count-label" id="countDisplay">Available Codes: 0</div>
    </div>

    <main class="codes-grid" id="codesGrid"></main>
  </div>

  <div class="toast-pill" id="toastPill">Code Copied!</div>

  <script>
    const RAW_CODES = [
      "KEUNULFW", "WLRCRJMR", "EUC6GDSQ", "N5CS4D9C", "HWWKPGF6",
      "BigChiefKeys", "HEROGEAR1000", "FROST500K", "FROST1MXD", "NEWVERSIONEV1",
      "HAPPYDAY15", "11120172", "438ZBHYA", "5NVXR8X6", "JZHDQ3LD",
      "FROST200K", "5CMG6L4C", "NQVVBPDK", "2WLQSRT7", "QMJHTWCQ",
      "CFXWMGZX", "VALJNWRC", "NQYBSZRU", "ZTUJTNFX", "LKELPEVD",
      "JLSHYTCA", "WCAHNEXZ", "WLZBJLPX", "SERPENT10", "HWRGTWZE",
      "GAMQQLPQ", "DMGNDZEXMV", "EUZYMLTD", "DVXQDREBUS", "LIONQUEEN", "EJGFULXG"
    ];

    const UNIQUE_CODES = [...new Set(RAW_CODES)];

    function playBeep() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.type = "sine";
        osc.frequency.setValueAtTime(587.33, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.12);
        gain.gain.setValueAtTime(0.12, ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, ctx.currentTime + 0.12);
        osc.start();
        osc.stop(ctx.currentTime + 0.12);
      } catch(e) {}
    }

    function showToast(msg) {
      const toast = document.getElementById('toastPill');
      toast.innerText = msg;
      toast.classList.add('show');
      playBeep();
      if (navigator.vibrate) navigator.vibrate(40);
      setTimeout(() => {
        toast.classList.remove('show');
      }, 1600);
    }

    function executeCopy(text) {
      if (navigator.clipboard && window.isSecureContext) {
        return navigator.clipboard.writeText(text);
      } else {
        return new Promise((resolve, reject) => {
          const textArea = document.createElement("textarea");
          textArea.value = text;
          textArea.style.position = "fixed";
          textArea.style.left = "-999999px";
          textArea.style.top = "-999999px";
          document.body.appendChild(textArea);
          textArea.focus();
          textArea.select();
          try {
            document.execCommand('copy');
            textArea.remove();
            resolve();
          } catch (err) {
            textArea.remove();
            reject(err);
          }
        });
      }
    }

    function copySingleCode(code, btn) {
      executeCopy(code).then(() => {
        showToast(`Copied: ${code}`);
        const originalText = btn.innerHTML;
        btn.classList.add('copied');
        btn.innerHTML = `✓ COPIED!`;
        setTimeout(() => {
          btn.classList.remove('copied');
          btn.innerHTML = originalText;
        }, 1800);
      }).catch(() => {
        showToast(`Error copying ${code}`);
      });
    }

    function copyAllCodes() {
      const btn = document.getElementById('btnCopyAll');
      const text = UNIQUE_CODES.join("\n");
      executeCopy(text).then(() => {
        showToast(`Copied All ${UNIQUE_CODES.length} Codes!`);
        btn.innerHTML = `✓ Copied All!`;
        setTimeout(() => {
          btn.innerHTML = `📋 Copy All`;
        }, 1800);
      });
    }

    function renderCards() {
      const query = document.getElementById('searchInput').value.trim().toUpperCase();
      const grid = document.getElementById('codesGrid');

      const visible = UNIQUE_CODES.filter(code => code.toUpperCase().includes(query));
      document.getElementById('countDisplay').innerText = `Available Codes: ${visible.length}`;

      grid.innerHTML = visible.map(code => `
        <div class="code-card">
          <div class="code-card-header">
            <span class="card-badge">GIFT CODE</span>
          </div>
          <div class="code-value">${code}</div>
          <button class="btn-copy" onclick="copySingleCode('${code}', this)">
            📋 Copy Code
          </button>
        </div>
      `).join('');
    }

    function toggleSpookyTheme() {
      const isHalloween = document.body.classList.toggle('halloween');
      document.getElementById('themeIcon').innerText = isHalloween ? '❄️' : '🎃';
      document.getElementById('themeText').innerText = isHalloween ? 'Frost Mode' : 'Spooky Tundra';
    }

    const canvas = document.getElementById('snowCanvas');
    const ctx = canvas.getContext('2d');
    let flakes = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    for (let i = 0; i < 60; i++) {
      flakes.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        r: Math.random() * 2 + 1,
        d: Math.random() + 0.5
      });
    }

    function drawSnow() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = document.body.classList.contains('halloween') ? 'rgba(255, 140, 0, 0.4)' : 'rgba(255, 255, 255, 0.5)';
      ctx.beginPath();
      for (let i = 0; i < flakes.length; i++) {
        const f = flakes[i];
        ctx.moveTo(f.x, f.y);
        ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2, true);
      }
      ctx.fill();

      for (let i = 0; i < flakes.length; i++) {
        const f = flakes[i];
        f.y += f.d;
        f.x += Math.sin(f.y / 20) * 0.5;
        if (f.y > canvas.height) {
          flakes[i] = { x: Math.random() * canvas.width, y: 0, r: f.r, d: f.d };
        }
      }
      requestAnimationFrame(drawSnow);
    }
    drawSnow();

    renderCards();
  </script>
</body>
</html>
