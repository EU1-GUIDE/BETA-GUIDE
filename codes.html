<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EU1 BETA | Gift Code Depot</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <style>
    :root {
      --bg-deep: #060b13;
      --bg-card: rgba(14, 26, 43, 0.85);
      --border-ice: rgba(120, 210, 255, 0.28);
      --accent-frost: #56d4ff;
      --accent-glow: rgba(86, 212, 255, 0.45);
      --text-main: #e8f5ff;
      --text-muted: #8ca3be;
      --gold-tag: #ffd166;
      --online-green: #00ff88;
      --discord-blurple: #5865f2;
    }

    body.halloween {
      --bg-deep: #09060f;
      --bg-card: rgba(26, 16, 36, 0.88);
      --border-ice: rgba(255, 123, 0, 0.4);
      --accent-frost: #ff8400;
      --accent-glow: rgba(255, 132, 0, 0.5);
      --text-main: #fff2e0;
      --text-muted: #ad94a8;
      --gold-tag: #ffb703;
      --online-green: #ffb703;
      --discord-blurple: #ff7700;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg-deep);
      color: var(--text-main);
      font-family: 'Rajdhani', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
      padding-bottom: 70px;
    }

    #snowCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    .container {
      position: relative;
      z-index: 2;
      width: min(94vw, 860px);
      margin: 0 auto;
      padding: 16px 8px;
    }

    /* Top navigation banner */
    .top-badge-banner {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(4, 9, 16, 0.85);
      border: 1px solid var(--border-ice);
      padding: 10px 16px;
      border-radius: 12px;
      backdrop-filter: blur(8px);
      margin-bottom: 24px;
    }

    .back-nav-link {
      color: var(--accent-frost);
      text-decoration: none;
      font-weight: 700;
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: color 0.2s;
    }

    .back-nav-link:hover {
      text-shadow: 0 0 10px var(--accent-glow);
    }

    .theme-toggle-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border-ice);
      color: var(--text-main);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
      white-space: nowrap;
    }

    .hero-header {
      text-align: center;
      padding: 24px 14px;
      margin-bottom: 24px;
      border-radius: 16px;
      background: radial-gradient(circle at center, rgba(86, 212, 255, 0.12) 0%, transparent 70%);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .hero-title {
      font-family: 'Cinzel', serif;
      font-size: 2.3rem;
      font-weight: 900;
      letter-spacing: 3px;
      color: #fff;
      text-transform: uppercase;
      text-shadow: 0 0 16px var(--accent-glow);
    }

    .hero-subtitle {
      color: var(--text-muted);
      font-size: 1.05rem;
      letter-spacing: 1.2px;
      margin-top: 6px;
    }

    /* Cohesive Search & Control Box */
    .filter-card {
      background: var(--bg-card);
      border: 1px solid var(--border-ice);
      border-radius: 16px;
      padding: 16px;
      backdrop-filter: blur(8px);
      margin-bottom: 24px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.35);
    }

    .search-row {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .search-input {
      flex: 1;
      height: 48px;
      background: rgba(4, 9, 16, 0.85);
      border: 1px solid var(--border-ice);
      border-radius: 10px;
      padding: 0 16px;
      color: #fff;
      font-family: 'Rajdhani', sans-serif;
      font-size: 1.05rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      min-width: 0; /* Prevents input flex blowout */
    }

    .search-input:focus {
      border-color: var(--accent-frost);
      box-shadow: 0 0 10px var(--accent-glow);
    }

    .btn-copy-all {
      height: 48px;
      padding: 0 20px;
      border-radius: 10px;
      border: 1px solid var(--accent-frost);
      background: rgba(86, 212, 255, 0.16);
      color: var(--accent-frost);
      font-family: 'Rajdhani', sans-serif;
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }

    .btn-copy-all:hover {
      background: var(--accent-frost);
      color: #040910;
      box-shadow: 0 0 14px var(--accent-glow);
    }

    .filter-meta-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text-muted);
    }

    .count-badge {
      color: var(--accent-frost);
    }

    /* Code Card Grid */
    .codes-container {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .code-card {
      background: var(--bg-card);
      border: 1px solid var(--border-ice);
      border-radius: 16px;
      padding: 20px;
      backdrop-filter: blur(8px);
      transition: all 0.25s ease;
    }

    .code-card:hover {
      border-color: var(--accent-frost);
      box-shadow: 0 6px 20px var(--accent-glow);
      transform: translateY(-2px);
    }

    .card-meta-tag {
      font-size: 0.75rem;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      padding: 4px 10px;
      border-radius: 6px;
      display: inline-block;
      margin-bottom: 12px;
      background: rgba(86, 212, 255, 0.15);
      color: var(--accent-frost);
      border: 1px solid rgba(86, 212, 255, 0.3);
    }

    .code-title {
      font-family: 'Cinzel', serif;
      font-size: 1.65rem;
      font-weight: 900;
      letter-spacing: 2px;
      color: #fff;
      margin-bottom: 16px;
      word-break: break-all;
    }

    .btn-copy-code {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--border-ice);
      background: rgba(18, 38, 62, 0.8);
      color: var(--accent-frost);
      font-family: 'Rajdhani', sans-serif;
      font-size: 1.05rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
      cursor: pointer;
    }

    .btn-copy-code:hover {
      background: var(--accent-frost);
      color: #040910;
      box-shadow: 0 0 14px var(--accent-glow);
    }

    .toast-popup {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: rgba(6, 11, 19, 0.95);
      border: 1px solid var(--online-green);
      color: #00ff88;
      padding: 12px 24px;
      border-radius: 30px;
